services:
  - type: web
    name: elevata-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Elevata <info@kigalibespoke.com>"
      - key: ALLOWED_ORIGIN
        value: https://elevata.kigalibespoke.com
      - key: CORS_ORIGIN
        value: https://elevata.kigalibespoke.com
